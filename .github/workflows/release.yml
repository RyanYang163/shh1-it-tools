name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      platform:
        description: "目标架构（Deb 应用用）"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: write

env:
  # 上游版本锁定 —— 升级时改这里，不要用 floating 分支
  UPSTREAM_REPO: "corentinth/it-tools"
  UPSTREAM_REPO_URL: "https://github.com/CorentinTh/it-tools.git"
  UPSTREAM_TAG: "2024.10.22-7ca5933"
  # 前端改为「按上游源码构建」（2026-09-30 审核反馈 F7 后从抽镜像产物改为源码构建）
  BUILD_FROM_UPSTREAM: "source"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: meta
        run: |
          set -euo pipefail
          APPID=$(python3 -c "import json;print(json.load(open('config.ini'))['id'])")
          VER=$(python3 -c "import json;print(json.load(open('config.ini'))['version'])")
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 指引 10.2 Step 3：tag 与 config.ini 的 version 必须完全一致（前缀 v 可选）
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::tag(${TAG}) 与 config.ini 的 version(${VER}) 不一致，平台会拒绝"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: 守卫 —— 已存在的 Release 一律拒绝覆盖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 坑 11：重新构建会改变 deb 内嵌时间戳 → sha256 变化 → 平台 checksum mismatch
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。禁止覆盖 —— 覆盖会改变资产哈希，导致平台校验失败。请改用新的版本号。"
            exit 1
          fi
          echo "Release $TAG 尚不存在，可以继续。"

      - name: 从上游源码构建前端（子路径 base + hash 路由）
        if: env.BUILD_FROM_UPSTREAM == 'source'
        run: |
          set -euo pipefail
          # ⚠️ 2026-09-30 审核反馈（1.0.009 批注）：
          #   ① [F7] 官方镜像是按「站点根 /」构建的，产物里 Vite 的 preload helper 自带一份
          #      写死的 base（`function(e){return "/"+e}`），与之无关地，懒加载 chunk 与样式
          #      都去请求 /assets/…（站点根）→ 404 → 部分工具打不开。
          #      给已构建产物打补丁修不干净（routing base / preload helper / worker 是三处独立的
          #      硬编码），因此改为**按上游源码构建**，用构建期 BASE_URL 让 base 进入全部产物。
          #   ② [F7] TOS 托管不做 SPA history 回退，深层链接与刷新都会 HTTP 404。
          #      改用 hash 路由（审核方给的备选方案）。
          #   ③ [F5] RSA 工具的 worker 脚本路径也随 base 一起由构建期决定。
          APPID="${{ steps.meta.outputs.appid }}"
          BASE="/${APPID}/"
          SRC="${RUNNER_TEMP}/upstream-src"

          git clone --depth 1 --branch "v${UPSTREAM_TAG}" "${UPSTREAM_REPO_URL}" "$SRC"
          cd "$SRC"

          # 上游 build 脚本带 vue-tsc 全量类型检查（与产物无关且慢），这里直接调 vite
          npm i -g pnpm@9.11.0 >/dev/null 2>&1
          pnpm install --frozen-lockfile=false --reporter=silent

          # (1) router 改 hash 模式 —— TOS 托管无 history 回退
          sed -i "s/import { createRouter, createWebHistory } from 'vue-router';/import { createRouter, createWebHashHistory } from 'vue-router';/" src/router.ts
          sed -i "s/createWebHistory(config\.app\.baseUrl)/createWebHashHistory(config.app.baseUrl)/" src/router.ts
          grep -q 'createWebHashHistory(config.app.baseUrl)' src/router.ts             || { echo "::error::router 改 hash 模式失败 —— 上游 src/router.ts 结构已变"; exit 1; }

          # (2) 带子路径 base 构建
          BASE_URL="${BASE}" pnpm exec vite build

          # (3) 门禁：产物里不得出现「未带应用前缀 /<app_id>/」的站根绝对引用。
          #     ⚠️ 注意区分：带 BASE_URL 构建后 index.html 里是「带前缀的绝对路径」
          #     （src="/shh1-it-tools/assets/…"），那是对的；要拦的是**不经过应用前缀**
          #     就直接打到站点根的引用 —— 那正是 1.0.009 被判 F7 的成因。
          #     每处门禁都必须能拦住人为改坏的产物，否则等于没有（已实测双向验证）。
          check_prefix() {
            local leftover
            leftover=$(printf '%s' "$2" | grep -v "/${APPID}/" || true)
            if [ -n "$leftover" ]; then
              echo "::error::$1 存在未带 /${APPID}/ 前缀的站根绝对引用："
              echo "$leftover" | head -5
              exit 1
            fi
          }
          check_prefix "index.html" "$(grep -oE '(src|href)="/[^"]*"' dist/index.html || true)"
          check_prefix "CSS"        "$(grep -rhoE 'url\(/[^)]*\)' dist/assets/*.css || true)"
          check_prefix "JS"         "$(grep -rhoE '"/assets/[^"]*"' dist/assets/*.js || true)"

          # preload helper 的 base 必须是应用前缀（1.0.009 的根因就出在这行）
          NEEDLE='return"'"${BASE}"'"+'
          grep -qF "$NEEDLE" dist/assets/index-*.js             || { echo "::error::Vite preload helper 的 base 不是 ${BASE} —— 懒加载 chunk 会打到站点根"; exit 1; }
          echo "  [OK] 源码构建完成：base=${BASE}，router=hash，产物无站根绝对引用"

          rm -rf "${GITHUB_WORKSPACE}/webui"
          cp -r dist "${GITHUB_WORKSPACE}/webui"
          echo "前端产物已就位：$(du -sh "${GITHUB_WORKSPACE}/webui" | cut -f1)"

      - name: 构建 Deb 包
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || 'x86_64' }}"
          # 必须先删掉可能存在的旧 webui.bz2，否则 build.sh 会认为无需重建，
          # 把占位页或上一版前端打进包里
          rm -f webui.bz2
          chmod +x build.sh
          ./build.sh "$PLATFORM"

      - name: 检查构建产物
        id: asset
        run: |
          set -euo pipefail
          APPID="${{ steps.meta.outputs.appid }}"
          PLATFORM="${{ github.event.inputs.platform || 'x86_64' }}"
          DEB="build/output/${APPID}_${PLATFORM}.deb"
          [ -f "$DEB" ] || { echo "::error::未找到 $DEB"; exit 1; }
          [ -f "${DEB}.sha256" ] || { echo "::error::缺少 ${DEB}.sha256 伴随文件"; exit 1; }
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.asset.outputs.deb }}" \
            "${{ steps.asset.outputs.deb }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.appid }} ${{ steps.meta.outputs.version }}" \
            --notes "TOS 7 应用包（${{ github.event.inputs.platform || 'x86_64' }}）。仅包含 TOS 平台集成配置与打包脚本，应用本体来自上游项目。"
