name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      platform:
        description: "目标架构（Deb 应用用）"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: write

env:
  # 上游版本锁定 —— 升级时改这里，不要用 floating 分支
  UPSTREAM_REPO: "corentinth/it-tools"
  UPSTREAM_TAG: "2024.10.22-7ca5933"
  # 产物是纯静态前端（true）还是自带二进制（false）
  BUILD_FROM_UPSTREAM: "dockerimg"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: meta
        run: |
          set -euo pipefail
          APPID=$(python3 -c "import json;print(json.load(open('config.ini'))['id'])")
          VER=$(python3 -c "import json;print(json.load(open('config.ini'))['version'])")
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 指引 10.2 Step 3：tag 与 config.ini 的 version 必须完全一致（前缀 v 可选）
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::tag(${TAG}) 与 config.ini 的 version(${VER}) 不一致，平台会拒绝"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: 守卫 —— 已存在的 Release 一律拒绝覆盖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 坑 11：重新构建会改变 deb 内嵌时间戳 → sha256 变化 → 平台 checksum mismatch
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。禁止覆盖 —— 覆盖会改变资产哈希，导致平台校验失败。请改用新的版本号。"
            exit 1
          fi
          echo "Release $TAG 尚不存在，可以继续。"

      - name: 从官方镜像提取已构建前端
        if: env.BUILD_FROM_UPSTREAM == 'dockerimg'
        run: |
          set -euo pipefail
          # 上游使用 pnpm 而非 npm，且 lockfile 存在 peer 冲突，本地构建不可靠。
          # 改为直接取官方镜像里已构建好的静态产物（Dockerfile 中
          # COPY --from=build-stage /app/dist /usr/share/nginx/html）。
          IMG="${UPSTREAM_REPO}:${UPSTREAM_TAG}"
          echo "拉取镜像 $IMG"
          docker pull "$IMG"
          CID=$(docker create "$IMG")
          rm -rf "${GITHUB_WORKSPACE}/webui"
          mkdir -p "${GITHUB_WORKSPACE}/webui"
          if ! docker cp "$CID:/usr/share/nginx/html/." "${GITHUB_WORKSPACE}/webui/" 2>/dev/null; then
            echo "::error::镜像内未找到 /usr/share/nginx/html"
            docker rm -f "$CID" || true
            exit 1
          fi
          docker rm -f "$CID" >/dev/null
          [ -f "${GITHUB_WORKSPACE}/webui/index.html" ] || { echo "::error::提取结果缺少 index.html"; exit 1; }

          # ⚠️ 平台审核反馈（2026-09-30 撤回 1.0.007）：
          # 本应用挂在反代子路径 /<app_id>/ 下，而官方镜像是按「站点根 /」构建的。
          # 「站根绝对」的地方必须逐处适配，否则页面会渲染出应用自己的 404 视图。
          APPID="${{ steps.meta.outputs.appid }}"
          BASE="/${APPID}/"
          cd "${GITHUB_WORKSPACE}/webui"

          # (1) 静态资源改相对路径（index.html / sw.js）
          sed -i 's|="/assets/|="./assets/|g; s|="/favicon|="./favicon|g; s|="/manifest|="./manifest|g; s|="/sw.js|="./sw.js|g' index.html
          sed -i "s|'/assets/|'./assets/|g" index.html
          [ -f sw.js ] && sed -i 's|"/assets/|"./assets/|g; s|"/index.html|"./index.html|g' sw.js || true

          # (2) ★ SPA router base —— 1.0.007 被撤回的根因。
          #     上游 src/router.ts: createWebHistory(config.app.baseUrl)
          #     vite.config.ts:      const baseUrl = process.env.BASE_URL ?? '/'
          #     官方镜像在默认 '/' 下构建，产物里是内联字面量 loadEnv({BASE_URL:"/",...})，直接改掉。
          MAIN="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' index.html | head -1)"
          [ -n "$MAIN" ] && [ -f "$MAIN" ] || { echo "::error::未在主 bundle 定位到 index-*.js"; exit 1; }
          grep -q 'BASE_URL:"/"' "$MAIN" || { echo "::error::$MAIN 中找不到 BASE_URL:\"/\" 内联字面量 —— 上游产物结构已变，必须重新确认适配方式，不得静默放过"; exit 1; }
          sed -i "s|BASE_URL:\"/\"|BASE_URL:\"${BASE}\"|g" "$MAIN"
          grep -q "BASE_URL:\"${BASE}\"" "$MAIN" || { echo "::error::SPA router base 改写失败"; exit 1; }
          echo "  [OK] SPA router base -> ${BASE}"

          # (3) Service Worker：绝对 "/sw.js" + scope "/" 会打到 TOS 站点根，改相对（相对页面 /<app_id>/ 解析）
          sed -i 's|"/sw\.js"|"./sw.js"|g; s|{scope:"/",type:"classic"}|{scope:"./",type:"classic"}|g' "$MAIN"
          grep -q '"./sw.js"' "$MAIN" || { echo "::error::Service Worker 路径改写失败"; exit 1; }
          echo "  [OK] Service Worker 路径与作用域 -> 子路径"

          # (4) CSS 里的站根绝对字体路径（相对 CSS 文件本身解析）
          for f in assets/*.css; do [ -f "$f" ] && sed -i 's|url(/assets/|url(./|g' "$f"; done

          # (5) manifest：scope / start_url / 图标改相对
          if [ -f manifest.webmanifest ]; then
            sed -i 's|"start_url":"/?|"start_url":"./?|; s|"scope":"/"|"scope":"./"|; s|"src":"/|"src":"./|g' manifest.webmanifest
          fi

          # (6) 兜底门禁：产物里不得再有站根绝对引用（"//host" 与 "https://…" 不受影响）
          if grep -nE '(src|href)="/[^/]' index.html; then echo "::error::index.html 仍有站根绝对引用"; exit 1; fi
          if grep -nE 'url\(/[^/]' assets/*.css; then echo "::error::CSS 仍有站根绝对引用"; exit 1; fi

          echo "前端产物已就位：$(du -sh "${GITHUB_WORKSPACE}/webui" | cut -f1)"

      - name: 构建 Deb 包
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || 'x86_64' }}"
          # 必须先删掉可能存在的旧 webui.bz2，否则 build.sh 会认为无需重建，
          # 把占位页或上一版前端打进包里
          rm -f webui.bz2
          chmod +x build.sh
          ./build.sh "$PLATFORM"

      - name: 检查构建产物
        id: asset
        run: |
          set -euo pipefail
          APPID="${{ steps.meta.outputs.appid }}"
          PLATFORM="${{ github.event.inputs.platform || 'x86_64' }}"
          DEB="build/output/${APPID}_${PLATFORM}.deb"
          [ -f "$DEB" ] || { echo "::error::未找到 $DEB"; exit 1; }
          [ -f "${DEB}.sha256" ] || { echo "::error::缺少 ${DEB}.sha256 伴随文件"; exit 1; }
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.asset.outputs.deb }}" \
            "${{ steps.asset.outputs.deb }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.appid }} ${{ steps.meta.outputs.version }}" \
            --notes "TOS 7 应用包（${{ github.event.inputs.platform || 'x86_64' }}）。仅包含 TOS 平台集成配置与打包脚本，应用本体来自上游项目。"
